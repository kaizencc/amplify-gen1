Description: Root Stack for AWS Amplify CLI
AWSTemplateFormatVersion: "2010-09-09"
Parameters:
  DeploymentBucketName:
    Type: String
    Default: DeploymentBucket
    Description: Name of the common deployment bucket provided by the parent stack
  AuthRoleName:
    Type: String
    Default: AuthRoleName
    Description: Name of the common deployment bucket provided by the parent stack
  UnauthRoleName:
    Type: String
    Default: UnAuthRoleName
    Description: Name of the common deployment bucket provided by the parent stack
Outputs:
  Region:
    Description: CloudFormation provider root stack Region
    Value:
      Ref: AWS::Region
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-Region
  StackName:
    Description: CloudFormation provider root stack ID
    Value:
      Ref: AWS::StackName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-StackName
  StackId:
    Description: CloudFormation provider root stack name
    Value:
      Ref: AWS::StackId
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-StackId
  AuthRoleArn:
    Value:
      Fn::GetAtt:
        - AuthRole
        - Arn
  UnauthRoleArn:
    Value:
      Fn::GetAtt:
        - UnauthRole
        - Arn
  DeploymentBucketName:
    Description: CloudFormation provider root stack deployment bucket name
    Value:
      Ref: DeploymentBucketName
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}-DeploymentBucketName
  AuthRoleName:
    Value:
      Ref: AuthRole
  UnauthRoleName:
    Value:
      Ref: UnauthRole
Resources:
  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName:
        Ref: DeploymentBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
  DeploymentBucketBlockHTTP:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: DeploymentBucketName
      PolicyDocument:
        Statement:
          - Action: s3:*
            Effect: Deny
            Principal: '*'
            Resource:
              - Fn::Join:
                  - ""
                  - - 'arn:aws:s3:::'
                    - Ref: DeploymentBucketName
                    - /*
              - Fn::Join:
                  - ""
                  - - 'arn:aws:s3:::'
                    - Ref: DeploymentBucketName
            Condition:
              Bool:
                aws:SecureTransport: false
  AuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ""
            Effect: Deny
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
      RoleName:
        Ref: AuthRoleName
  UnauthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ""
            Effect: Deny
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
      RoleName:
        Ref: UnauthRoleName
  analyticsreactamplified:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/amplify-reactamplified-abcde-0b8df-deployment/amplify-cfn-templates/analytics/pinpoint-cloudformation-template.json
      Parameters:
        appName: reactamplified
        roleName: pinpointLambdaRoled97aae9d
        cloudformationPolicyName: cloudformationPolicyd97aae9d
        cloudWatchPolicyName: cloudWatchPolicyd97aae9d
        pinpointPolicyName: pinpointPolicyd97aae9d
        authPolicyName: pinpoint_amplify_d97aae9d
        unauthPolicyName: pinpoint_amplify_d97aae9d
        authRoleName:
          Ref: AuthRoleName
        unauthRoleName:
          Ref: UnauthRoleName
        authRoleArn:
          Fn::GetAtt:
            - AuthRole
            - Arn
        env: abcde
  analyticsreactamplifiedKinesis:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/amplify-reactamplified-abcde-0b8df-deployment/amplify-cfn-templates/analytics/kinesis-cloudformation-template.json
      Parameters:
        kinesisStreamName: reactamplifiedKinesis
        kinesisStreamShardCount: 1
        authRoleName:
          Ref: AuthRoleName
        unauthRoleName:
          Ref: UnauthRoleName
        authPolicyName: kinesis_amplify_7f827584
        unauthPolicyName: kinesis_amplify_7f827584
        env: abcde
  apireactamplified:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/amplify-reactamplified-abcde-0b8df-deployment/amplify-cfn-templates/api/cloudformation-template.json
      Parameters:
        AppSyncApiName: reactamplified
        DynamoDBBillingMode: PAY_PER_REQUEST
        DynamoDBEnableServerSideEncryption: false
        S3DeploymentBucket: amplify-reactamplified-abcde-0b8df-deployment
        S3DeploymentRootKey: amplify-appsync-files/211d4d18fece75a28ec5f9e9295e01da723be761
        env: abcde
  authreactamplified93066f02:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/amplify-reactamplified-abcde-0b8df-deployment/amplify-cfn-templates/auth/reactamplified93066f02-cloudformation-template.json
      Parameters:
        identityPoolName: reactamplified93066f02_identitypool_93066f02
        allowUnauthenticatedIdentities: true
        resourceNameTruncated: reacta93066f02
        userPoolName: reactamplified93066f02_userpool_93066f02
        autoVerifiedAttributes: email
        mfaConfiguration: "OFF"
        mfaTypes: SMS Text Message
        smsAuthenticationMessage: Your authentication code is {####}
        smsVerificationMessage: Your verification code is {####}
        emailVerificationSubject: Your verification code
        emailVerificationMessage: Your verification code is {####}
        defaultPasswordPolicy: false
        passwordPolicyMinLength: 8
        passwordPolicyCharacters: ""
        requiredAttributes: email
        aliasAttributes: ""
        userpoolClientGenerateSecret: false
        userpoolClientRefreshTokenValidity: 30
        userpoolClientWriteAttributes: email
        userpoolClientReadAttributes: email
        userpoolClientLambdaRole: reacta93066f02_userpoolclient_lambda_role
        userpoolClientSetAttributes: false
        sharedId: 93066f02
        resourceName: reactamplified93066f02
        authSelections: identityPoolAndUserPool
        useDefault: default
        userPoolGroupList: ""
        serviceName: Cognito
        usernameCaseSensitive: false
        useEnabledMfas: true
        authRoleArn:
          Fn::GetAtt:
            - AuthRole
            - Arn
        unauthRoleArn:
          Fn::GetAtt:
            - UnauthRole
            - Arn
        breakCircularDependency: true
        dependsOn: ""
        env: abcde
  geomap1b8eae72:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/amplify-reactamplified-abcde-0b8df-deployment/amplify-cfn-templates/geo/map1b8eae72-cloudformation-template.json
      Parameters:
        authRoleName:
          Ref: AuthRoleName
        unauthRoleName:
          Ref: UnauthRoleName
        mapName: map1b8eae72
        mapStyle: VectorEsriStreets
        isDefault: true
        authreactamplified93066f02UserPoolId:
          Fn::GetAtt:
            - authreactamplified93066f02
            - Outputs.UserPoolId
        env: abcde
  hostingamplifyhosting:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: https://s3.amazonaws.com/amplify-reactamplified-abcde-0b8df-deployment/amplify-cfn-templates/hosting/amplifyhosting-template.json
      Parameters:
        appId: d1350ke7ta4aar
        type: manual
        env: abcde
  UpdateRolesWithIDPFunction:
    DependsOn:
      - AuthRole
      - UnauthRole
      - authreactamplified93066f02
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile:
          Fn::Join:
            - |2+
            - - const response = require('cfn-response');
              - const { IAMClient, GetRoleCommand, UpdateAssumeRolePolicyCommand } = require('@aws-sdk/client-iam');
              - exports.handler = function(event, context) {
              - '    // Don''t return promise, response.send() marks context as done internally'
              - '    const ignoredPromise = handleEvent(event, context)'
              - '};'
              - async function handleEvent(event, context) {
              - '    try {'
              - '        let authRoleName = event.ResourceProperties.authRoleName;'
              - '        let unauthRoleName = event.ResourceProperties.unauthRoleName;'
              - '        let idpId = event.ResourceProperties.idpId;'
              - '        let authParamsJson = {'
              - '            ''Version'': ''2012-10-17'','
              - '            ''Statement'': [{'
              - '                ''Effect'': ''Allow'','
              - '                ''Principal'': {''Federated'': ''cognito-identity.amazonaws.com''},'
              - '                ''Action'': ''sts:AssumeRoleWithWebIdentity'','
              - '                ''Condition'': {'
              - '                    ''StringEquals'': {''cognito-identity.amazonaws.com:aud'': idpId},'
              - '                    ''ForAnyValue:StringLike'': {''cognito-identity.amazonaws.com:amr'': ''authenticated''}'
              - '                }'
              - '            }]'
              - '        };'
              - '        let unauthParamsJson = {'
              - '            ''Version'': ''2012-10-17'','
              - '            ''Statement'': [{'
              - '                ''Effect'': ''Allow'','
              - '                ''Principal'': {''Federated'': ''cognito-identity.amazonaws.com''},'
              - '                ''Action'': ''sts:AssumeRoleWithWebIdentity'','
              - '                ''Condition'': {'
              - '                    ''StringEquals'': {''cognito-identity.amazonaws.com:aud'': idpId},'
              - '                    ''ForAnyValue:StringLike'': {''cognito-identity.amazonaws.com:amr'': ''unauthenticated''}'
              - '                }'
              - '            }]'
              - '        };'
              - '        if (event.RequestType === ''Delete'') {'
              - '            try {'
              - '                delete authParamsJson.Statement[0].Condition;'
              - '                delete unauthParamsJson.Statement[0].Condition;'
              - '                authParamsJson.Statement[0].Effect = ''Deny'''
              - '                unauthParamsJson.Statement[0].Effect = ''Deny'''
              - '                let authParams = {PolicyDocument: JSON.stringify(authParamsJson), RoleName: authRoleName};'
              - '                let unauthParams = {PolicyDocument: JSON.stringify(unauthParamsJson), RoleName: unauthRoleName};'
              - '                const iam = new IAMClient({region: event.ResourceProperties.region});'
              - '                let res = await Promise.all(['
              - '                    iam.send(new GetRoleCommand({RoleName: authParams.RoleName})),'
              - '                    iam.send(new GetRoleCommand({RoleName: unauthParams.RoleName}))'
              - '                ]);'
              - '                res = await Promise.all(['
              - '                    iam.send(new UpdateAssumeRolePolicyCommand(authParams)),'
              - '                    iam.send(new UpdateAssumeRolePolicyCommand(unauthParams))'
              - '                ]);'
              - '                response.send(event, context, response.SUCCESS, {});'
              - '            } catch (err) {'
              - '                console.log(err.stack);'
              - '                response.send(event, context, response.SUCCESS, {Error: err});'
              - '            }'
              - '        } else if (event.RequestType === ''Update'' || event.RequestType === ''Create'') {'
              - '            const iam = new IAMClient({region: event.ResourceProperties.region});'
              - '            let authParams = {PolicyDocument: JSON.stringify(authParamsJson), RoleName: authRoleName};'
              - '            let unauthParams = {PolicyDocument: JSON.stringify(unauthParamsJson), RoleName: unauthRoleName};'
              - '            const res = await Promise.all(['
              - '                iam.send(new UpdateAssumeRolePolicyCommand(authParams)),'
              - '                iam.send(new UpdateAssumeRolePolicyCommand(unauthParams))'
              - '            ]);'
              - '            response.send(event, context, response.SUCCESS, {});'
              - '        }'
              - '    } catch (err) {'
              - '        console.log(err.stack);'
              - '        response.send(event, context, response.FAILED, {Error: err});'
              - '    }'
              - '};'
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 300
      Role:
        Fn::GetAtt:
          - UpdateRolesWithIDPFunctionRole
          - Arn
  UpdateRolesWithIDPFunctionOutputs:
    Type: Custom::LambdaCallout
    Properties:
      ServiceToken:
        Fn::GetAtt:
          - UpdateRolesWithIDPFunction
          - Arn
      region:
        Ref: AWS::Region
      idpId:
        Fn::GetAtt:
          - authreactamplified93066f02
          - Outputs.IdentityPoolId
      authRoleName:
        Ref: AuthRole
      unauthRoleName:
        Ref: UnauthRole
  UpdateRolesWithIDPFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Join:
          - ""
          - - Ref: AuthRole
            - -idp
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: UpdateRolesWithIDPFunctionPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: arn:aws:logs:*:*:*
              - Effect: Allow
                Action:
                  - iam:UpdateAssumeRolePolicy
                  - iam:GetRole
                Resource:
                  Fn::GetAtt:
                    - AuthRole
                    - Arn
              - Effect: Allow
                Action:
                  - iam:UpdateAssumeRolePolicy
                  - iam:GetRole
                Resource:
                  Fn::GetAtt:
                    - UnauthRole
                    - Arn
